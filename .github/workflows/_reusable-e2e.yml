name: "[reusable] E2E Tests"

on:
  workflow_call:
    inputs:
      backend-image:
        type: string
        required: true
      frontend-image:
        type: string
        required: true
      environment:
        type: string
        default: "staging"
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  e2e:
    name: Full Stack E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Start full stack
        run: |
          echo "BACKEND_IMAGE=${{ inputs.backend-image }}" >> .env
          echo "FRONTEND_IMAGE=${{ inputs.frontend-image }}" >> .env
          # TODO: docker-compose -f docker-compose.e2e.yml up -d
          echo "⚠️ E2E stack startup not implemented yet"

      - name: Run E2E suite
        run: |
          echo "⚠️ E2E tests not implemented yet"
          echo "Варианты: Playwright, k6, Go e2e package"

      - name: Teardown
        if: always()
        run: echo "Stack teardown placeholder"

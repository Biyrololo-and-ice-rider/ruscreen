name: "[reusable] Go Backend CI"

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        type: string
        default: "1.26"
      image-name:
        description: "GHCR image name, e.g. ghcr.io/org/meet-server"
        type: string
        required: true
      run-integration:
        description: "Run integration tests (requires Redis service)"
        type: boolean
        default: false
      run-e2e:
        description: "Run E2E tests"
        type: boolean
        default: false
    secrets:
      GHCR_TOKEN:
        required: true

# ──────────────────────────────────────────────
# Image tag strategy:
#   branch dev/server     → dev
#   branch master/main    → stable
#   branch feature/*      → feature-<slug>
#   tag    v*             → semver (v1.2.3)
#   PR                    → pr-<number>
# ──────────────────────────────────────────────

jobs:
  # ── 1. Lint ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  # ── 2. Unit tests ────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run unit tests
        run: go test ./internal/domain/... ./internal/usecase/... -v -race -count=1 -coverprofile=coverage-unit.out

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.out
          retention-days: 7

  # ── 3. Integration tests (optional) ──────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.run-integration }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run integration tests
        run: go test ./internal/infra/... ./internal/adapter/... -v -race -count=1 -tags=integration -coverprofile=coverage-integration.out
        env:
          REDIS_URL: redis://localhost:6379

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 7

  # ── 4. E2E tests (stub, future) ──────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.run-e2e }}
    steps:
      - uses: actions/checkout@v4
      # TODO: запустить docker-compose с полным стеком и гонять e2e сценарии
      # Пример: newman (Postman), k6, или кастомный Go e2e пакет
      - name: E2E placeholder
        run: echo "E2E tests not implemented yet — add your runner here"

  # ── 5. Build binary ──────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Build binary
        run: go build -o bin/meet ./cmd/server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: meet-binary
          path: bin/meet
          retention-days: 3

  # ── 6. Docker build & push to GHCR ───────────
  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          REF="${GITHUB_REF}"
          PR="${{ github.event.pull_request.number }}"

          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"          # v1.2.3
          elif [[ "$REF" == refs/heads/master || "$REF" == refs/heads/main ]]; then
            TAG="stable"
          elif [[ "$REF" == refs/heads/dev/server ]]; then
            TAG="dev"
          elif [[ -n "$PR" ]]; then
            TAG="pr-${PR}"
          else
            SLUG="${REF#refs/heads/}"
            SLUG="${SLUG//\//-}"             # feature/foo → feature-foo
            TAG="${SLUG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${TAG}"

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. CI Report ─────────────────────────────
  report:
    name: CI Report
    runs-on: ubuntu-latest
    needs: [lint, test-unit, build, docker]
    if: always()
    uses: ./.github/workflows/_reusable-report.yml@infra
    with:
      service: "server (Go)"
      lint-result: ${{ needs.lint.result }}
      test-unit-result: ${{ needs.test-unit.result }}
      build-result: ${{ needs.build.result }}
      docker-result: ${{ needs.docker.result }}
      image-tag: ${{ needs.docker.outputs.image-tag }}
